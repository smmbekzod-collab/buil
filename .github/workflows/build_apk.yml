name: Android APK Yaratish (CI/CD)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v4

      - name: Java JDK 17 o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Flutter SDK o'rnatish
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Loyihani ochish va APK yig'ish
        run: |
          # 1. Agar mobile_app.zip bo'lsa, ochamiz
          if [ -f "mobile_app.zip" ]; then
            echo "mobile_app.zip ochilmoqda..."
            mkdir -p mobile_app
            unzip -o mobile_app.zip -d mobile_app
          fi

          # 2. Ishchi papkaga o'tamiz
          TARGET_DIR="."
          if [ -d "mobile_app" ] && [ -f "mobile_app/pubspec.yaml" ]; then
            TARGET_DIR="mobile_app"
          elif [ -d "mobile_app" ] && [ -f "mobile_app/mobile_app/pubspec.yaml" ]; then
            TARGET_DIR="mobile_app/mobile_app"
          elif [ -f "pubspec.yaml" ]; then
            TARGET_DIR="."
          fi
          cd "$TARGET_DIR"
          echo "Ishchi papka: $(pwd)"

          # 3. Android platformasini yaratish
          rm -rf android
          flutter create --org com.agrostar --platforms android .

          # 4. android/app/build.gradle sozlamalarini yangilash (compileSdk 35, minSdk 21)
          APP_GRADLE="android/app/build.gradle"
          if [ -f "$APP_GRADLE" ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/g' "$APP_GRADLE"
            sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 35/g' "$APP_GRADLE"
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' "$APP_GRADLE"
          fi

          # 5. AndroidManifest.xml ga Kamera va GPS ruxsatlarini kiritish
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-feature android:name="android.hardware.camera" android:required="false"/>\n    <uses-feature android:name="android.hardware.camera.front" android:required="false"/>' "$MANIFEST"
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"
          fi

          # 6. Paketlarni yangilash
          flutter pub upgrade --major-versions || flutter pub get

          # 7. Release APK yig'ish
          flutter build apk --release --no-tree-shake-icons

      - name: Tayyor APK faylini yuklab olish uchun saqlash (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: agrostar-davomat-release-apk
          path: "**/build/app/outputs/flutter-apk/app-release.apk"
