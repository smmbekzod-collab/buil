name: Android APK Yaratish (CI/CD)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v4

      - name: Java JDK 17 o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Flutter SDK o'rnatish
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Kutubxonalarni yuklash (flutter pub get)
        working-directory: mobile_app
        run: flutter pub get

      - name: Release APK yig'ish (flutter build apk)
        working-directory: mobile_app
        run: flutter build apk --release

      - name: Tayyor APK faylini yuklab olish uchun saqlash (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: agrostar-davomat-release-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
